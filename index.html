body{

.card{

width:100%;
max-width:700px;

}

}

.subtitle{

}

.desc{

font-size:22px;
line-height:1.6;
margin-bottom:30px;
}

.datebox{

background:rgba(255,255,255,.12);

padding:20px;

border-radius:20px;

margin-bottom:25px;
}

.datebox h2{
font-size:34px;
margin-bottom:10px;
}

.countdown{

font-size:28px;
font-weight:bold;

margin-top:10px;
color:#ffd700;
}

.button{

display:inline-block;

padding:14px 28px;

background:#d4af37;

color:#000;

text-decoration:none;

border-radius:999px;

font-size:20px;
font-weight:bold;

margin-top:20px;
}

.footer{

margin-top:35px;

font-size:26px;
}

@media(max-width:600px){

h1{
font-size:40px;
}

}

}

}

</style>
</head>

<body>

<div class="card">

</div>

<p class="desc">
Hayatlarımızı birleştirdiğimiz bu özel günde,
sizleri de mutluluğumuza ortak olmaya davet ediyoruz.
</p>

<div class="datebox">

<h2>1 Kasım 2026</h2>

<div>
🕖 Saat 19:00
</div>

<div id="countdown"
class="countdown">
Yükleniyor...
</div>

</div>

https://maps.google.com
📍 Konuma Git
</a>

<div class="footer">
Sevgiyle ❤️
<br><br>

</div>

</div>

<script>

const weddingDate =
new Date("2026-11-01T19:00:00");

function updateCountdown(){

const now = new Date();

const diff =
weddingDate - now;

if(diff <= 0){

document.getElementById("countdown")
.innerHTML =
"Bugün Büyük Gün ❤️";

return;
}

const days =
Math.floor(diff /
(1000*60*60*24));

document.getElementById("countdown")
.innerHTML =
"💞 Büyük güne "
+ days +
" gün kaldı";
}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
