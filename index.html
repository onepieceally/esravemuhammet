<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhammet ❤️ Esra</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;lay=swap

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=80");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
overflow-x:hidden;
}

#hearts{
position:fixed;
inset:0;
pointer-events:none;
z-index:1;
}

.heart{
position:absolute;
bottom:-50px;
animation:float linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(0) rotate(0deg);
}
100%{
transform:translateY(-120vh) rotate(360deg);
}
}

.container{
position:relative;
z-index:2;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.card{
width:100%;
max-width:900px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.25);
border-radius:35px;
padding:50px;
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.names{
font-family:'Cormorant Garamond',serif;
font-size:80px;
font-weight:700;
color:#ffd700;
margin-bottom:10px;
}

.subtitle{
font-size:30px;
letter-spacing:2px;
margin-bottom:30px;
}

.message{
font-size:18px;
line-height:1.9;
max-width:700px;
margin:auto;
margin-bottom:35px;
}

.countdown{
font-size:32px;
font-weight:700;
color:#ffd700;
margin-bottom:35px;
}

.section{
background:rgba(255,255,255,.08);
padding:25px;
border-radius:25px;
margin:20px 0;
}

.section h2{
margin-bottom:15px;
font-size:28px;
color:#ffd700;
}

.btn{
display:inline-block;
margin-top:15px;
padding:14px 28px;
border-radius:50px;
background:linear-gradient(45deg,#ffd700,#ffeb99);
color:#222;
font-weight:700;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.music{
margin-top:25px;
}

.music button{
background:#ff4081;
color:white;
border:none;
padding:14px 26px;
border-radius:50px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.music button:hover{
transform:scale(1.05);
}

.footer{
margin-top:40px;
font-size:22px;
color:#fff;
}

hr{
border:none;
height:1px;
background:rgba(255,255,255,.25);
margin:30px 0;
}

@media(max-width:768px){

.card{
padding:30px 20px;
}

.names{
font-size:48px;
}

.subtitle{
font-size:22px;
}

.countdown{
font-size:22px;
}

.message{
font-size:16px;
}

}

</style>

</head>
<body>

<div id="hearts"></div>

<div class="container">

<div class="card">

<div class="names">
Muhammet ❤️ Esra
</div>

<div class="subtitle">
Düğün Davetiyesi
</div>

<p class="message">
Hayatlarımızı birleştirdiğimiz bu özel yolculukta,
en mutlu günümüzde siz değerli dostlarımızı ve ailemizi
aramızda görmekten büyük mutluluk duyacağız.

<br><br>

Sevincimizi paylaşmak ve bu güzel anımıza şahit olmanız için
sizleri düğünümüze davet ediyoruz.
</p>

<div id="countdown" class="countdown"></div>

<hr
